<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chatwright · 多平台 AI 对话</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --line: #e4e8f0;
    --text: #1f2430;
    --muted: #7a8296;
    --primary: #2563eb;
    --ok: #16a34a;
    --err: #dc2626;
    --run: #2563eb;
    --wait: #9aa3b5;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  header {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 20px 6px;
  }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .ver {
    font-size: 12px; color: var(--muted); font-weight: 400;
    background: #eef0f5; border-radius: 999px; padding: 2px 8px;
    vertical-align: middle; margin-left: 4px;
  }

  .layout {
    max-width: 1280px;
    margin: 0 auto;
    padding: 14px 20px 80px;
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }

  /* ---------------- 侧边栏 ---------------- */
  .sidebar {
    width: 250px;
    flex: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    position: sticky;
    top: 14px;
    max-height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
  }
  .new-conv {
    width: 100%;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .new-conv:hover { opacity: 0.92; }
  .headless-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--muted);
    padding: 6px 2px 8px; cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--line); margin-bottom: 8px;
  }
  .headless-toggle:hover { color: var(--text); }
  #conv-list {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .conv-item {
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .conv-item:hover { background: #f0f4fb; }
  .conv-item.active { background: #eff4ff; border-color: var(--primary); }
  .conv-item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-item .m { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .conv-empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 18px 0; }

  /* ---------------- 主区域 ---------------- */
  .content { flex: 1; min-width: 0; }
  .composer {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
  }
  textarea {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--primary); }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }
  .platforms { display: flex; flex-wrap: wrap; gap: 8px; }
  .pchip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    background: #fafbfe;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .pchip:hover { border-color: var(--primary); }
  .pchip.on { background: #eff4ff; border-color: var(--primary); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); flex: none; }
  .pchip .dot.ok { background: var(--ok); }
  .pchip .dot.no { background: #f59e0b; }
  .pchip .lbl { font-weight: 600; }
  .pchip .note { color: var(--muted); font-size: 12px; }
  .pchip .login {
    border: none; background: none; color: var(--primary);
    font-size: 12px; cursor: pointer; padding: 0;
  }
  .pchip .login:hover { text-decoration: underline; }
  .pchip .logout {
    border: none; background: none; color: #b91c1c;
    font-size: 12px; cursor: pointer; padding: 0;
  }
  .pchip .logout:hover { text-decoration: underline; }
  .buttons { display: flex; gap: 8px; }
  button.primary {
    border: none; background: var(--primary); color: #fff;
    border-radius: 8px; padding: 9px 18px; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .login-box {
    margin-top: 10px; padding: 10px 12px;
    border: 1px dashed var(--primary); border-radius: 8px;
    background: #f6f9ff; font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .login-box .msg { flex: 1; min-width: 200px; }
  .login-box button {
    border: 1px solid var(--primary); background: #fff; color: var(--primary);
    border-radius: 6px; font-size: 12.5px; padding: 4px 12px; cursor: pointer;
  }
  .login-box button.done { background: var(--primary); color: #fff; }
  .perr {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
    margin-top: 10px; display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap;
  }
  .perr button {
    border: 1px solid #d97706; background: #fff; color: #92400e;
    border-radius: 6px; font-size: 12.5px; padding: 3px 12px; cursor: pointer;
  }
  .offline {
    background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    border-radius: var(--radius); padding: 14px 16px; font-size: 14px;
    margin-bottom: 16px;
  }
  .offline code {
    background: #fee2e2; border-radius: 4px; padding: 1px 6px; font-size: 13px;
  }
  .offline a { color: var(--primary); }

  .round {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-top: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
  }
  .round-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; flex-wrap: wrap;
  }
  .round-head .q { font-weight: 600; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .round-head .time { color: var(--muted); font-size: 12px; flex: none; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 110px;
  }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 700; font-size: 14px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge.wait { background: #eef0f5; color: var(--wait); }
  .badge.run { background: #e3edff; color: var(--run); }
  .badge.ok  { background: #e5f6ec; color: var(--ok); }
  .badge.err { background: #fdeaea; color: var(--err); }
  .card .body {
    font-size: 13.5px; white-space: pre-wrap; word-break: break-word;
    color: #333b4d; max-height: 340px; overflow-y: auto;
  }
  .card .body.err { color: var(--err); }
  .card .foot { display: flex; justify-content: space-between; align-items: center; }
  .card .elapsed { color: var(--muted); font-size: 11.5px; }
  .card .copy {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 6px; font-size: 12px; padding: 3px 10px; cursor: pointer;
  }
  .card .copy:hover { color: var(--text); }
  .card .stop {
    border: 1px solid var(--err); background: #fff; color: var(--err);
    border-radius: 6px; font-size: 12px; padding: 3px 12px; cursor: pointer;
  }
  .card .stop:hover { background: #fdeaea; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #c7d4f5; border-top-color: var(--primary);
    animation: spin 0.8s linear infinite;
    display: inline-block; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Markdown 渲染 ---------- */
  .md-p { margin: 4px 0; }
  .md-h { margin: 8px 0 4px; }
  .md-table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; max-width: 100%; display: block; overflow-x: auto; }
  .md-table th, .md-table td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md-table th { background: #f0f4fb; }
  .md-code { background: #f6f8fa; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-size: 12px; white-space: pre; }
  .md-code-inline { background: #eef1f6; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .md-quote { border-left: 3px solid var(--primary); margin: 6px 0; padding: 2px 10px; color: var(--muted); }
  .md-li { margin-left: 18px; }
  .md-link { color: var(--primary); }

  /* ---------- 发送选项 ---------- */
  .opts {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 13px; color: var(--text);
  }
  .opt { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .opt select, .opt input[type="file"] { font-size: 12.5px; max-width: 220px; }
  .opt-hint { color: var(--muted); font-size: 12px; }
  .plat-opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .plat-opt {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--line);
    border-radius: 999px; background: #fafbfe; cursor: pointer; user-select: none;
  }
  .plat-opt:has(input:checked) { background: #eff4ff; border-color: var(--primary); }
  .empty {
    text-align: center; color: var(--muted); font-size: 14px;
    padding: 40px 0;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    z-index: 10; max-width: 80vw;
  }
  .toast.show { opacity: 0.95; }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; max-height: 220px; }
  }
</style>
</head>
<body>
<header>
  <h1>🦐 Chatwright <span id="ver" class="ver"></span></h1>
  <p>一条消息同时发给多个网页 AI，默认在同一对话里继续，可新建 / 切回旧对话。</p>
</header>

<main class="layout">
  <aside class="sidebar">
    <button class="new-conv" id="new-conv">＋ 新建对话</button>
    <label class="headless-toggle">
      <input type="checkbox" id="headless-mode"> 无头模式（不弹浏览器窗口）
    </label>
    <div id="conv-list"></div>
  </aside>

  <div class="content">
    <div id="offline-banner" class="offline" hidden>
      ⚠️ 当前是直接打开的静态页面，连不上 Chatwright 后端，所以平台列表无法加载。
      请先运行 <code>.venv\Scripts\python run_web.py</code>（或双击项目里的
      <code>启动网站.bat</code>），然后访问 <a href="http://127.0.0.1:8765">http://127.0.0.1:8765</a>。
    </div>

    <section class="composer">
      <textarea id="input" placeholder="输入你想问的问题，比如：用一句话介绍你自己（Ctrl+Enter 发送）"></textarea>
      <div class="opts">
        <div class="plat-opts" id="plat-opts"></div>
        <label class="opt">模型
          <select id="opt-model"><option value="">默认</option></select>
        </label>
        <label class="opt">附件 <input type="file" id="opt-file"></label>
      </div>
      <div class="row">
        <div class="platforms" id="platforms"></div>
        <div class="buttons">
          <button class="primary" id="send">发送到所选平台</button>
        </div>
      </div>
      <div id="platform-error" class="perr" hidden>
        平台列表加载失败：<span id="platform-error-msg"></span>
        <button id="retry-platforms">重新加载</button>
      </div>
      <div id="loginbox"></div>
    </section>

    <section id="rounds"></section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const input = $("#input"), sendBtn = $("#send"), roundsBox = $("#rounds");
let platformMeta = {};        // id -> {label, desc, needs_login, logged_in}
let activeLogin = null;       // 正在登录的平台 id
const timers = {};            // job_id -> 轮询定时器
const sentAt = {};            // job_id -> 开始时间
const jobConv = {};           // job_id -> 所属对话 id
let conversations = [];       // [{id, title, rounds: [], urls: {}}]
let activeConvId = null;

// ---------------------------------------------------------------- 对话管理
function activeConv() {
  return conversations.find((c) => c.id === activeConvId) || null;
}

function newConversation() {
  const conv = { id: "c" + Date.now(), title: "新对话", rounds: [], urls: {} };
  conversations.unshift(conv);
  activeConvId = conv.id;
  // 让所有平台从新会话开始（没有常驻会话的平台自动跳过）
  fetch("/api/conversations/new", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ platforms: Object.keys(platformMeta) }),
  }).catch(() => {});
  renderSidebar();
  renderRounds();
  toast("已新建对话，接下来发送的消息会从新会话开始");
}

async function switchConversation(id) {
  if (id === activeConvId) return;
  const conv = conversations.find((c) => c.id === id);
  if (!conv) return;
  activeConvId = id;
  // 把每个参与过该对话的平台页面导航回当时的对话 URL，恢复上下文
  const urls = {};
  Object.entries(conv.urls || {}).forEach(([p, u]) => { if (u) urls[p] = u; });
  if (Object.keys(urls).length) {
    fetch("/api/conversations/switch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ urls }),
    }).catch(() => {});
  }
  renderSidebar();
  renderRounds();
}

function renderSidebar() {
  const box = $("#conv-list");
  if (!conversations.length) {
    box.innerHTML = `<div class="conv-empty">还没有对话</div>`;
    return;
  }
  box.innerHTML = "";
  conversations.forEach((conv) => {
    const item = document.createElement("div");
    item.className = "conv-item" + (conv.id === activeConvId ? " active" : "");
    const last = conv.rounds[0] || null;
    const title = conv.title || "新对话";
    const time = last ? new Date(last.sentAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) : "";
    item.innerHTML = `
      <div class="t">${escapeHtml(title)}</div>
      <div class="m">${conv.rounds.length} 轮${time ? " · " + time : ""}</div>`;
    item.addEventListener("click", () => switchConversation(conv.id));
    box.appendChild(item);
  });
}

function renderRounds() {
  const conv = activeConv();
  roundsBox.innerHTML = "";
  if (!conv || !conv.rounds.length) {
    roundsBox.innerHTML = `<div class="empty">当前是「${conv ? escapeHtml(conv.title) : ""}」。输入问题，勾选平台，点“发送”——
      默认在同一个对话里继续，模型会记得上下文；想重开一局就点左侧“新建对话”。</div>`;
    return;
  }
  conv.rounds.forEach((round) => {
    const div = document.createElement("div");
    div.className = "round";
    div.dataset.job = round.jobId;
    const elapsed = Math.round((Date.now() - (round.sentAt || Date.now())) / 1000);
    div.innerHTML = `
      <div class="round-head">
        <span class="q">${escapeHtml(round.message)}</span>
        <span class="time">${elapsed}s</span>
      </div>
      <div class="grid"></div>`;
    const grid = div.querySelector(".grid");
    grid.innerHTML = round.platforms.map((id) => cardHtml(id, round.results[id], round.jobId)).join("");
    grid.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", () => copyText(btn.dataset.copy, btn));
    });
    grid.querySelectorAll("[data-stop]").forEach((btn) => {
      btn.addEventListener("click", () => stopPlatform(btn.dataset.stop));
    });
    roundsBox.appendChild(div);
  });
}

// ---------------------------------------------------------------- 平台选择
async function loadPlatforms(tries = 3) {
  const errBox = $("#platform-error");
  for (let i = 0; i < tries; i++) {
    try {
      const res = await fetch("/api/platforms");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const list = await res.json();
      platformMeta = {};
      list.forEach((p) => { platformMeta[p.id] = p; });
      renderPlatforms();
      renderModelSelect();
      errBox.hidden = true;
      return;
    } catch (e) {
      if (i < tries - 1) await new Promise((r) => setTimeout(r, 1500));
      else {
        $("#platform-error-msg").textContent = e.message || "无法连接后端服务";
        errBox.hidden = false;
      }
    }
  }
}

function renderModelSelect() {
  const sel = $("#opt-model");
  const models = new Set();
  Object.values(platformMeta).forEach((p) => (p.models || []).forEach((m) => models.add(m)));
  const current = sel.value;
  sel.innerHTML = '<option value="">默认</option>';
  [...models].forEach((m) => {
    const o = document.createElement("option");
    o.value = m;
    o.textContent = m;
    sel.appendChild(o);
  });
  sel.value = [...models].includes(current) ? current : "";
  sel.disabled = models.size === 0;
}

function renderPlatforms() {
  const box = $("#platforms");
  box.innerHTML = "";
  Object.values(platformMeta).forEach((p) => {
    const chip = document.createElement("div");
    chip.className = "pchip on";
    chip.dataset.id = p.id;
    const dotCls = !p.needs_login ? "ok" : (p.logged_in ? "ok" : "no");
    const authBtns = !p.needs_login ? "" : (p.logged_in
      ? `<button class="login" data-relogin="${p.id}">重登</button>
         <button class="logout" data-logout="${p.id}">注销</button>`
      : `<button class="login" data-login="${p.id}">去登录</button>`);
    const note = !p.needs_login ? "免登录" : (p.logged_in ? "已登录" : (p.guest_ok ? "游客可用" : "未登录"));
    chip.innerHTML = `
      <span class="dot ${dotCls}"></span>
      <span class="lbl">${p.label}</span>
      <span class="note">${note}</span>
      ${authBtns}
    `;
    chip.addEventListener("click", (e) => {
      if (e.target.matches("[data-login], [data-relogin]")) {
        e.preventDefault();
        startLogin(p.id);
        return;
      }
      if (e.target.matches("[data-logout]")) {
        e.preventDefault();
        logoutPlatform(p.id);
        return;
      }
      chip.classList.toggle("on");
      renderPlatOpts();
    });
    box.appendChild(chip);
  });
  renderPlatOpts();
}

function renderPlatOpts() {
  const box = $("#plat-opts");
  const picks = selectedPlatforms();
  if (!picks.length) {
    box.innerHTML = `<span class="opt-hint">勾选平台后，可在这里单独开启各平台的思考模式</span>`;
    return;
  }
  box.innerHTML = "";
  picks.forEach((id) => {
    const p = platformMeta[id];
    if (!p) return;
    const lab = document.createElement("label");
    lab.className = "plat-opt";
    lab.innerHTML = `<input type="checkbox" data-think="${id}"> ${escapeHtml(p.label)} 思考`;
    box.appendChild(lab);
  });
}

function selectedPlatforms() {
  return [...document.querySelectorAll("#platforms .pchip.on")].map((c) => c.dataset.id);
}

// ---------------------------------------------------------------- 登录流程
async function startLogin(id) {
  if (activeLogin) { toast("先完成当前登录流程再操作其他平台"); return; }
  try {
    const r = await fetch(`/api/login/${id}`, { method: "POST" }).then((x) => x.json());
    activeLogin = id;
    $("#loginbox").innerHTML = `
      <div class="login-box">
        <span class="msg">${r.message || "请在打开的浏览器窗口中完成登录"}</span>
        <button class="done" data-finish="save">已登录，保存</button>
        <button data-finish="cancel">取消</button>
      </div>`;
    toast("浏览器窗口已弹出，请完成登录");
  } catch (e) {
    toast("打开登录窗口失败：" + (e.message || e));
  }
}

async function finishLogin(save) {
  const id = activeLogin;
  if (!id) return;
  try {
    const r = await fetch(`/api/login/${id}/finish`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ save }),
    }).then((x) => x.json());
    if (r.login_pending) {
      toast(r.message || "登录尚未完成，请先在浏览器窗口里完成登录");
      return;
    }
    activeLogin = null;
    $("#loginbox").innerHTML = "";
    toast(r.message || (save ? "登录态已保存" : "已取消"));
  } catch (e) {
    toast("操作失败：" + (e.message || e));
  }
  await loadPlatforms();
}

async function logoutPlatform(id) {
  const p = platformMeta[id];
  if (!confirm(`确定注销 ${p ? p.label : id} 的本地登录吗？注销后需要重新登录才能使用。`)) return;
  try {
    const r = await fetch(`/api/logout/${id}`, { method: "POST" }).then((x) => x.json());
    toast(r.message || "已注销");
  } catch (e) {
    toast("注销失败：" + (e.message || e));
  }
  await loadPlatforms();
}

// ---------------------------------------------------------------- 聊天任务
async function sendMessage() {
  const message = input.value.trim();
  const picks = selectedPlatforms();
  const conv = activeConv();
  if (!message) { toast("先输入一条消息"); return; }
  if (!picks.length) { toast("至少勾选一个平台"); return; }
  if (!conv) { toast("请先新建对话"); return; }

  sendBtn.disabled = true;
  try {
    const thinking = {};
    document.querySelectorAll("#plat-opts input[data-think]").forEach((cb) => {
      thinking[cb.dataset.think] = cb.checked;
    });
    const options = { thinking, model: $("#opt-model").value };
    const fileInput = $("#opt-file");
    if (fileInput.files && fileInput.files.length) {
      const fd = new FormData();
      fd.append("file", fileInput.files[0]);
      const up = await fetch("/api/upload", { method: "POST", body: fd }).then((r) => r.json());
      options.file = up.path;
      fileInput.value = "";
      toast(`已附带文件：${up.name || "附件"}`);
    }
    const { job_id } = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, platforms: picks, conv_id: conv.id, options }),
    }).then((r) => r.json());

    if (conv.title === "新对话") conv.title = message.slice(0, 24);
    conv.rounds.unshift({ jobId: job_id, message, platforms: picks, results: {}, sentAt: Date.now() });
    jobConv[job_id] = conv.id;
    sentAt[job_id] = Date.now();
    renderSidebar();
    renderRounds();
    timers[job_id] = setInterval(() => pollJob(job_id), 1200);
    pollJob(job_id);
  } catch (e) {
    toast("发送失败：" + (e.message || e));
  } finally {
    sendBtn.disabled = false;
  }
}

async function pollJob(jobId) {
  let job;
  try {
    job = await fetch(`/api/jobs/${jobId}`).then((r) => r.json());
  } catch { return; }
  const conv = conversations.find((c) => c.id === jobConv[jobId]);
  if (!conv) return;
  const round = conv.rounds.find((r) => r.jobId === jobId);
  if (!round) return;
  round.results = job.results || {};
  // 记录每个平台当时的对话 URL（用于以后切回该对话）
  Object.entries(round.results).forEach(([p, r]) => {
    if (r && r.status === "done" && r.url) conv.urls[p] = r.url;
  });
  renderRounds();
  renderSidebar();
  const results = Object.values(round.results);
  if (results.length > 0 && results.every((r) => r.status !== "running")) {
    clearInterval(timers[jobId]);
    delete timers[jobId];
  }
}

function cardHtml(id, res, jobId) {
  const p = platformMeta[id];
  if (!p) return "";
  const state = res ? res.status : "wait";
  const badge = {
    wait: ["wait", "等待中"],
    running: ["run", "对话中"],
    done: ["ok", "完成"],
    error: ["err", "失败"],
    stopped: ["wait", "已停止"],
  }[state] || ["wait", "等待中"];

  let body, foot = `<span class="elapsed"></span>`;
  if (state === "done") {
    body = `<div class="body md">${renderMarkdown(res.reply || "(空回复)")}</div>`;
    foot = `<span class="elapsed">${res.elapsed}s</span>
            <button class="copy" data-copy="${escapeAttr(res.reply || "")}">复制</button>`;
  } else if (state === "error") {
    body = `<div class="body err">${escapeHtml(res.error || "未知错误")}</div>`;
  } else if (state === "running") {
    body = `<div class="body" style="color:var(--muted)">正在网页里输入并等待 AI 流式回复…</div>`;
    foot = `<span class="elapsed"></span>
            <button class="stop" data-stop="${jobId}|${id}">停止</button>`;
  } else {
    body = `<div class="body" style="color:var(--muted)">排队中…</div>`;
  }

  return `
    <div class="card">
      <div class="top">
        ${state === "running" ? `<span class="spinner"></span>` : ""}
        <span class="name">${p.label}</span>
        <span class="badge ${badge[0]}">${badge[1]}</span>
      </div>
      ${body}
      <div class="foot">${foot}</div>
    </div>`;
}

async function stopPlatform(key) {
  const [jobId, id] = key.split("|");
  try {
    await fetch(`/api/jobs/${jobId}/stop`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ platforms: [id] }),
    }).then((r) => r.json());
    toast("已请求停止" + (platformMeta[id] ? platformMeta[id].label : id));
  } catch (e) {
    toast("停止失败：" + (e.message || e));
  }
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent;
    btn.textContent = "已复制";
    setTimeout(() => (btn.textContent = old), 1200);
  });
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/\n/g, "&#10;"); }

// ---------------------------------------------------------------- Markdown
function renderMarkdown(src) {
  const lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let i = 0;
  let inCode = false, codeBuf = [], codeLang = "";
  let tableBuf = null;
  const flushTable = () => {
    if (tableBuf) { html += buildTable(tableBuf); tableBuf = null; }
  };
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line.trim())) {
      flushTable();
      if (inCode) {
        html += `<pre class="md-code"><code>${escapeHtml(codeBuf.join("\n"))}</code></pre>`;
        codeBuf = []; inCode = false;
      } else {
        codeLang = line.trim().slice(3).trim();
        inCode = true;
      }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      if (!tableBuf) tableBuf = [];
      tableBuf.push(line); i++; continue;
    }
    flushTable();
    const t = line.trim();
    if (!t) { i++; continue; }
    if (/^#{1,6}\s/.test(t)) {
      const level = t.match(/^#{1,6}/)[0].length;
      html += `<h${Math.min(level, 4)} class="md-h">${inlineMd(t.replace(/^#{1,6}\s*/, ""))}</h${Math.min(level, 4)}>`;
    } else if (/^\s*[-*+]\s+/.test(t)) {
      html += `<div class="md-li">• ${inlineMd(t.replace(/^\s*[-*+]\s+/, ""))}</div>`;
    } else if (/^\s*\d+\.\s+/.test(t)) {
      html += `<div class="md-li">${inlineMd(t.replace(/^\s*\d+\.\s+/, ""))}</div>`;
    } else if (/^\s*>\s?/.test(t)) {
      html += `<blockquote class="md-quote">${inlineMd(t.replace(/^\s*>\s?/, ""))}</blockquote>`;
    } else {
      html += `<p class="md-p">${inlineMd(t)}</p>`;
    }
    i++;
  }
  flushTable();
  if (inCode) html += `<pre class="md-code"><code>${escapeHtml(codeBuf.join("\n"))}</code></pre>`;
  return html;
}

function inlineMd(s) {
  let h = escapeHtml(s);
  h = h.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<a class="md-link" href="$2" target="_blank" rel="noopener">图片：$1</a>');
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a class="md-link" href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/`([^`]+)`/g, '<code class="md-code-inline">$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  return h;
}

function buildTable(rows) {
  const cells = rows.map((r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
  let start = 0;
  const isSep = (r) => r && r.length && r.every((c) => /^:?-{2,}:?$/.test(c));
  if (isSep(cells[0])) start = 1;
  if (!cells[start]) return "";
  const head = cells[start];
  const body = cells.slice(isSep(cells[start + 1]) ? start + 2 : start + 1);
  let h = '<table class="md-table"><thead><tr>';
  for (const c of head) h += "<th>" + inlineMd(c) + "</th>";
  h += "</tr></thead><tbody>";
  for (const row of body) {
    h += "<tr>";
    for (const c of row) h += "<td>" + inlineMd(c) + "</td>";
    h += "</tr>";
  }
  h += "</tbody></table>";
  return h;
}

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

// ---------------------------------------------------------------- 事件绑定
$("#send").addEventListener("click", sendMessage);
$("#new-conv").addEventListener("click", newConversation);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendMessage();
});
$("#loginbox").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-finish]");
  if (btn) finishLogin(btn.dataset.finish === "save");
});
$("#retry-platforms").addEventListener("click", () => loadPlatforms(3));
$("#headless-mode").addEventListener("change", async (e) => {
  const headless = e.target.checked;
  try {
    await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ headless }),
    }).then((r) => r.json());
    toast(headless
      ? "已开启无头模式：豆包/元宝/Kimi 不再弹窗口（如失效可点右上角开关关回）"
      : "已关闭无头模式：恢复常驻窗口");
  } catch {
    toast("设置失败，请确认服务已重启到 v1.4.0");
  }
});

// ---------------------------------------------------------------- 初始化
if (location.protocol === "file:") {
  $("#offline-banner").hidden = false;
  document.querySelector(".composer").style.display = "none";
  document.querySelector(".sidebar").style.display = "none";
} else {
  newConversation(); // 默认先建一个对话
  loadPlatforms();
  fetch("/api/config")
    .then((r) => r.json())
    .then((c) => { $("#headless-mode").checked = !!c.headless; })
    .catch(() => {});
  fetch("/api/version")
    .then((r) => r.json())
    .then((v) => { $("#ver").textContent = "v" + v.version; })
    .catch(() => {});
}
